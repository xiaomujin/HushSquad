name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: 门禁（fmt / clippy / test / deny / 依赖纯净）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 工具链由 rust-toolchain.toml 决定，这里只保证组件齐全
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-deny

      # 为什么必须装：cpal 0.18 在 Linux 上的 ALSA 后端是**非可选**依赖
      # （Cargo.toml 里 `[target.'cfg(target_os = "linux")'.dependencies] alsa = "0.11"`，
      # 没有 optional 标记），而 alsa-sys 的 build script 用 pkg-config 找 alsa.pc。
      # ubuntu-latest 镜像**不带** libasound2-dev，于是 `cargo clippy` 在编译 cpal 时就
      # 以 101 退出——那是机器缺库，不是代码有问题（Windows 上走 WASAPI，不碰这条路，
      # 所以本机 scripts/check.ps1 全绿也发现不了）。
      # 装完之后 cpal / audio-io 在 Linux 上能编过，门禁才谈得上「检查代码」。
      - name: 系统依赖（Linux 上 cpal 必须链 ALSA）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy（-D warnings）
        run: cargo clippy --workspace --all-targets -- -D warnings

      # 合成素材不进仓库（.gitignore 里写了「固定种子，CI 里跑一次 gen 就够」），
      # 但**顺序是硬要求**：`crates/testkit/tests/baseline.rs` 要拿这 6 条素材去比
      # testdata/baseline.json。gen 排在 `cargo test` 之后的话，测试会因为
      # 「打不开 testdata/synthetic/clean_48k_mono.wav」直接红（exit 101）——
      # 本机看不出来，是因为素材早就躺在工作区里了。
      # 时长必须用**默认的 20 s**：基线里的指标是按 20 s 素材算的，`--seconds 3`
      # 生成出来的前 3 秒数值并不相同（扫频/归一化跟总时长有关，实测 11 项超差）。
      - name: 生成合成素材（种子 42，20 s/条）
        run: cargo run -p testkit -- gen --out testdata/synthetic

      - name: 测试
        run: cargo test --workspace

      - name: 离线回放冒烟（素材 → 链路 → 热路径零分配门禁）
        run: |
          cargo run -p testkit -- run --in testdata/synthetic/clean_48k_mono.wav \
            --out out/proc.wav --chain opus --codec opus:10ms:32k --report out/report.json

      - name: 许可证 / advisory / 来源 / 禁用 crate
        run: cargo deny check

      - name: audio-core 依赖纯净断言
        run: |
          if cargo tree -p audio-core --edges normal | grep -Eq "tokio|axum|tower|hyper"; then
            echo "FAIL: audio-core 引入了网络运行时依赖，实时链路必须保持纯净" >&2
            exit 1
          fi
          echo "OK: audio-core 无网络运行时依赖"
