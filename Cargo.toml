# HushSquad workspace
# 依赖方向（硬约束）：ui → app → client-core → {audio-core, protocol, transport}
# audio-core 不得依赖 transport / protocol；server-core 不依赖 audio-core（v1 无 MCU）。

[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]   # apps/loopback 是 P2 的临时二进制，P6 前一直在用
# apps/app 是**独立的 workspace**（自己的 Cargo.toml 里有 [workspace] 表）。
# 不 exclude 的话，上面的 apps/* 会把它扫进来，cargo 直接报
# 「multiple workspace roots found in the same workspace」。
# 为什么独立：Tauri 的依赖树 + WebView2/webkit2gtk 系统库不该绑架音频门禁，
# 见 docs/ADR/ADR-0014-桌面外壳与门禁的边界.md。
exclude = ["apps/app"]

[workspace.package]
version = "0.0.0"             # 未发布，0.0.0 表示骨架阶段
edition = "2024"
rust-version = "1.96"         # MSRV 下限：由 deep-filter-rt 抬高；见 docs/crates-选型验证报告-v0.1.md §3
publish = false               # 许可证待定，暂不对外发布（见 docs/执行方案与步骤-v0.1.md §12.1）

[workspace.dependencies]
# 版本依据 docs/crates-选型验证报告-v0.1.md 的实证结论。⚠️ 标记项不得承重。
# 注意：workspace 层不能写 optional，可选性由各成员 crate 声明 { workspace = true, optional = true }。
cpal = "0.18"
rtrb = "0.4"
rubato = "5"
nnnoiseless = "0.5"                        # 低延迟档 + VAD
sonora-agc2 = "0.3"                         # AGC2（WebRTC 移植，含 RNN VAD），BSD-3
sonora-simd = "0.3"                         # sonora-agc2 的 SIMD 后端，需要显式选后端
opus = "0.4"
neteq = { version = "0.9", default-features = false }   # 必须关默认 feature，否则拉进 axum/tokio
chacha20poly1305 = "0.11"
hkdf = "0.13"                                # 语音密钥派生（HKDF-SHA256），RFC 5869
sha2 = "0.11"                                # hkdf 的哈希后端
prost = "0.14"                               # 控制面 protobuf 运行时
argon2 = "0.6"                               # 密码登录校验（argon2id，PHC 字符串）
# 必须是 0.41+：更早的版本捆绑 SQLite <= 3.53.2，撞 RUSTSEC-2026-0459（CVE-2026-119375，
# WAL 页大小不一致时可能读到未初始化的页缓存内存）。0.41 捆 SQLite 3.54.1。
rusqlite = { version = "0.41", features = ["bundled"] }
rpassword = "7"                              # 终端里不回显地读密码（命令行不再出现明文密码）
# 构建期依赖：protox 是**纯 Rust** 的 protobuf 编译器，因此 CI/新机器不需要装 protoc。
# 只有 build.rs 用，不进任何运行时二进制。
prost-build = "0.14"
protox = "0.10"
# testkit（离线工具）用：wav 读写、报告 JSON。只在 CLI 侧，不进实时链路。
hound = "3"                                  # WAV 读写，Apache-2.0
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustls = "0.23"                            # 勿用 0.24-dev
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "sync", "io-util", "signal"] }
tokio-rustls = "0.26"                      # 控制面 TLS 1.3（底层 rustls 0.23）
getrandom = "0.4"                          # voice_token 的 16 字节随机量
deep-filter-rt = "0.2"                     # ⚠️ 仅桌面/高端安卓，feature = denoise-dfn3
ndarray = "0.17"                            # deep-filter-rt 的输入/输出类型（Array2）

# 实时链路需要接近 release 的性能，但要保留符号以便性能分析
[profile.release]
lto = "thin"
codegen-units = 1
debug = 1

# 全局 lint 底线
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.cargo]
# 依赖清单是选型结论的记录（docs/crates-选型验证报告-v0.1.md），P1 起逐个被真正使用；
# 在此之前不因「尚未使用」而报警，避免每次构建 11 条噪音掩盖真正的警告。
unused_workspace_dependencies = "allow"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
print_stdout = "warn"        # 实时线程禁止打印；CLI（testkit）自行 allow
