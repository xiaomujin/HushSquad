# cargo-deny 配置。CI 必跑；本仓库的许可证纪律在这里落地。
# 依据：docs/crates-选型验证报告-v0.1.md §2.9 与 docs/执行方案与步骤-v0.1.md §12.1

[advisories]
version = 2
yanked = "deny"        # 被撤回的版本一律不许用
ignore = [
    # RUSTSEC-2026-0293：ringbuf < 0.5.2 的 Consumer::skip/clear 在元素 Drop 会 panic 时会二次释放。
    # 为什么可以暂时忽略（2026-11-17，见执行方案 执行记录 9u）：
    #   1) **neteq 0.9.1 的源码里没有任何 ringbuf 引用**（`grep -r ringbuf neteq-0.9.1/src` 为空），
    #      它只是 Cargo.toml 里的遗留依赖 → 没有调用点，漏洞路径在本仓库不可达；
    #   2) 我们的代码也不直接依赖 ringbuf（自己的环形缓冲用 rtrb）；
    #   3) 触发条件还要求元素类型的 Drop 会 panic，而 neteq 环形缓冲里的载荷是 Vec<u8>。
    # 解除条件：neteq 升级到依赖 ringbuf >= 0.5.2 的版本，或我们换掉 neteq。
    # 在此之前**不得**新引入任何依赖 ringbuf 0.3 的 crate。
    "RUSTSEC-2026-0293",
]

[licenses]
version = 2
# 只允许宽松许可证。AGPL / GPL / SSPL 等强传染许可证不在列表内 → 默认拒绝。
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.9

# 自有 crate 尚未指定许可证（许可证待定，见 docs/执行方案与步骤-v0.1.md §12.1）。
# 它们全部 publish = false，因此按「私有 crate」跳过许可证检查；
# 注意：这只跳过检查，不改变「不得引入 AGPL / 来源不明代码」这条约束。
private = { ignore = true }

# 依赖还很少，allow 列表必然有未命中的项；升级依赖后自然会命中，不因此告警。
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"     # 依赖必须写明确版本，不许用 *
deny = [
    { name = "mumcord-codec", reason = "AGPL-3.0-only，禁止链接；只能阅读参考" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
