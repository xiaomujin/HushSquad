// HushSquad 控制面协议 v1 —— 草案，未实现，仅供评审
// 配套文档：docs/协议草案-v0.1.md
// 编码：protobuf proto3；传输：TLS 1.3 over TCP，ALPN hushsquad/1
// 帧格式：u32 BE 长度前缀 + ControlMessage 序列化字节；单帧上限 64 KiB
// 规则：未知字段必须忽略；未知 oneof 分支必须忽略并记日志；破坏性改动提升主版本。

syntax = "proto3";

package hushsquad.v1;

// 顶层信封：所有控制面消息都包在这里，方便服务端单点分发与限速。
message ControlMessage {
  uint32 protocol = 1;   // 主版本，当前 1；未填视为 1
  uint64 request_id = 2; // 客户端自增，用于请求/响应配对（0 表示无需响应）
  oneof kind {
    ClientHello      client_hello      = 10;
    ServerHello      server_hello      = 11;
    Auth             auth              = 12;
    AuthResult       auth_result       = 13;
    ChannelSync      channel_sync      = 20;
    ChannelAdded     channel_added     = 21;
    ChannelRemoved   channel_removed   = 22;
    ChannelUpdated   channel_updated   = 23;
    // 25-28：频道结构的写操作（P7-2）。需要 PERM_CREATE_CHANNEL / PERM_MANAGE_CHANNEL。
    CreateChannel    create_channel    = 25;
    UpdateChannel    update_channel    = 26;
    MoveChannel      move_channel      = 27;
    DeleteChannel    delete_channel    = 28;
    JoinChannel      join_channel      = 30;
    LeaveChannel     leave_channel     = 31;
    UserJoined       user_joined       = 40;
    UserLeft         user_left         = 41;
    UserUpdated      user_updated      = 42;
    SetSelfState     set_self_state    = 50;
    SetListening     set_listening     = 51;
    Whisper          whisper           = 52;
    RekeyRequest     rekey_request     = 60;
    RekeyResponse    rekey_response    = 61;
    Ping             ping              = 70;
    Pong             pong              = 71;
    Stats            stats             = 72;
    Error            error             = 90;
    // 110-119：管理与权限（ADR-0016）
    MoveUser         move_user         = 110;
    SetUserState     set_user_state    = 111;
    KickUser         kick_user         = 112;
    ListUsers        list_users        = 113;
    UserList         user_list         = 114;
    SetUserPerms     set_user_perms    = 115;
    PermsChanged     perms_changed     = 116;
    // 100-199 预留：文本聊天、文件传输、管理面板
    // 200-255 预留：扩展能力，需在 caps 位图中声明
  }
}

// ---------------------------- 握手与认证 ----------------------------

message ClientHello {
  uint32 protocol_min = 1;        // 客户端支持的最低主版本
  uint32 protocol_max = 2;        // 最高主版本
  string client_version = 3;      // 如 0.1.0
  string platform = 4;            // windows | macos | linux | android
  string device_id = 5;           // 稳定设备标识（哈希后），用于 device token 绑定
  uint64 caps = 6;                // 能力位图，见 Caps
}

// 能力位：双方都在 hello 中置位才启用对应行为。
enum Caps {
  CAPS_UNSPECIFIED     = 0;
  CAPS_RED             = 1;  // 支持语音包级冗余
  CAPS_DTX             = 2;  // 支持静音帧与 DTX 边界
  CAPS_LISTEN_MULTI    = 4;  // 支持多频道监听
  CAPS_WHISPER         = 8;  // 支持定向语音
  CAPS_STATS           = 16; // 支持服务器 1 Hz 统计
}

message ServerHello {
  uint32 protocol = 1;            // 服务器选定版本
  string server_version = 2;
  uint64 session_id = 3;
  uint32 sender_id = 4;           // 语音包标识，会话内不复用
  string voice_host = 5;          // 语音面地址（域名或 IP）。
                                  // **空 = 沿用客户端连控制面时实际用到的地址**：
                                  // 云主机（网卡是内网 IP、公网靠 NAT）与局域网都靠这个默认值
                                  // 自动正确；只有语音面在另一台机器/另一个对外 IP 时才填。
  uint32 voice_port = 6;
  bytes  voice_token = 7;         // 16 B，UDP Bind 凭证
  uint32 key_epoch = 8;           // 当前语音密钥版本
  uint32 channel_epoch = 9;       // 加入频道后由服务器更新
  uint64 server_time_ms = 10;     // 用于 RTT/偏移估算（只做差值）
  uint64 caps = 11;               // 服务器支持的能力位
  Limits limits = 12;
}

message Limits {
  uint32 max_control_msg_bytes = 1;   // 默认 65536
  uint32 max_control_msgs_per_sec = 2; // 默认 50
  uint32 max_voice_pps = 3;           // 默认 150
  uint32 max_voice_payload_bytes = 4; // 默认 400
  uint32 max_channel_users = 5;       // 默认 64
  uint32 max_listening_channels = 6;  // 默认 8
  uint32 ping_interval_ms = 7;        // 默认 15000
  uint32 ping_timeout_ms = 8;         // 默认 45000
}

message Auth {
  oneof method {
    PasswordAuth    password     = 1;
    DeviceTokenAuth device_token = 2;
  }
  string client_nonce = 3; // 可选，用于审计日志关联
}

message PasswordAuth {
  string username = 1;
  string password = 2;  // 仅在 TLS 内传输；服务端 argon2id 校验
}

message DeviceTokenAuth {
  string username     = 1;
  bytes  device_token = 2; // 登录成功后由服务端下发并本地保存
}

message AuthResult {
  bool   ok        = 1;
  uint32 user_id   = 2;
  uint64 perms     = 3;  // 权限位图，见 Perm
  bytes  device_token = 4; // 首次密码登录成功时下发，供后续免密
  uint32 error_code = 5; // ok=false 时有效，见 ErrorCode
  string message   = 6;
}

// 权限位（ADR-0016：账号级的**全局**位图，不做按频道 ACL）。
//
// 位是**只追加**的：一旦发出去就不能重排，只能在末尾加新的位。
// 四个内置角色是这些位的命名组合（见 server-core::perms）：
//   成员 1；协管 1|2|4|128；管理员 1|2|4|8|16|32|64|128；服主 再加 256。
// 组合是**嵌套**的（成员 ⊂ 协管 ⊂ 管理员 ⊂ 服主），这条让「不能操作权限比自己高的人」
// 可以用一个子集判断表达。
enum Perm {
  PERM_UNSPECIFIED      = 0;
  PERM_JOIN_CHANNEL     = 1;
  PERM_MOVE_ANYONE      = 2;   // 管理员把别人拉/踢出频道
  PERM_KICK             = 4;
  PERM_BAN              = 8;   // v1 不做，位保留
  PERM_CREATE_CHANNEL   = 16;
  PERM_MANAGE_CHANNEL   = 32;
  PERM_ADMIN            = 64;
  PERM_MUTE_OTHERS      = 128; // 服务器静音别人（语音面已有执行路径）
  PERM_OWNER            = 256; // 服主：唯一，可转移
}

// ---------------------------- 频道与成员 ----------------------------

message ChannelState {
  uint32 channel_id = 1;
  uint32 parent_id  = 2;   // 0 表示根
  string name       = 3;
  uint32 position   = 4;   // 同级排序
  uint32 max_users  = 5;   // 0 表示用服务器默认
  uint64 flags      = 6;   // 位：1=临时频道 2=需要密码 4=只允许监听 8=分组（不可加入）
  string description = 7;
  uint32 channel_epoch = 8; // 成员快照版本，与语音包头部对应
}

message UserState {
  uint32 user_id   = 1;
  uint32 sender_id = 2;    // 服务器分配的语音标识
  string name      = 3;
  uint32 channel_id = 4;   // 0 表示不在任何频道
  bool   self_mute  = 5;
  bool   self_deaf  = 6;
  bool   server_mute = 7;  // 被管理员静音
  bool   server_deaf = 8;
  uint32 priority_speaker = 9; // 0 普通；>0 说话时压低他人（可选能力）
  repeated uint32 listening_channel_ids = 10;
}

message ChannelSync {
  repeated ChannelState channels = 1;
  repeated UserState    users    = 2;
  uint32 self_channel_id = 3;
}

message ChannelAdded   { ChannelState channel = 1; }
message ChannelRemoved { uint32 channel_id = 1; }
message ChannelUpdated { ChannelState channel = 1; }

// ---------------------------- 频道结构写操作（P7-2） ----------------------------
//
// 服务器是单线程状态机，所以「两个管理员同时改」天然串行；但客户端仍然要按
// 「广播到了才算数」处理（唯一例外是拖拽排序，它乐观更新，见设计文档 §6.5）。

// 新建频道。需要 PERM_CREATE_CHANNEL。成功后向所有人广播 ChannelAdded。
message CreateChannel {
  uint32 parent_id = 1;   // 0 = 根
  string name      = 2;   // 1-32 字符，去首尾空白，禁 '/' 与控制字符
  uint64 flags     = 3;   // 只认已知位；bit3 = 分组（不可加入）
  uint32 max_users = 4;   // 0 = 用服务器默认
}

// 改名字 / 人数上限 / 标志位。需要 PERM_MANAGE_CHANNEL。
// 三个字段都是 optional：不填就是「不改」（proto3 的 optional 才有存在性）。
message UpdateChannel {
  uint32 channel_id        = 1;
  optional string name     = 2;
  optional uint32 max_users = 3;
  optional uint64 flags    = 4;
}

// 移动 / 排序。需要 PERM_MANAGE_CHANNEL。
//
// 「插在第几位」由前端算成整数下标（拖拽的落点判定在 UI 里做），服务器只负责
// 夹到合法范围、防成环、把新旧两个父级的 position 在一个事务里重排成 0..n-1。
// 没有单独的 ReorderChannels 消息：一次拖拽就是一条 MoveChannel。
message MoveChannel {
  uint32 channel_id = 1;
  uint32 parent_id  = 2;   // 0 = 根
  uint32 position   = 3;   // 同级下标；超出范围夹到末尾
}

// 删除频道（连同子树）。需要 PERM_MANAGE_CHANNEL。
// 频道里有人就拒绝 —— 静默把人挪走是权限系统里最容易挨骂的行为。
message DeleteChannel { uint32 channel_id = 1; }

message JoinChannel  { uint32 channel_id = 1; string password = 2; }
message LeaveChannel { }

message UserJoined  { UserState user = 1; }
message UserLeft    { uint32 user_id = 1; }
message UserUpdated { UserState user = 1; }

message SetSelfState {
  bool self_mute = 1;
  bool self_deaf = 2;
  // PTT 是否按下不在此消息中：为免控制面抖动，PTT 由语音包存在与否表达。
}

message SetListening {
  repeated uint32 channel_ids = 1; // 最多 limits.max_listening_channels 个
}

message Whisper {
  repeated uint32 target_user_ids = 1;
  uint32 channel_id = 2;             // 可选：只对某频道定向
  bool   stop = 3;                   // true 表示结束定向
}

// ---------------------------- 管理与权限（ADR-0016） ----------------------------
//
// 每个请求都要服务器重新校验权限：客户端的菜单裁剪只是可发现性，不是安全边界。
// 失败一律回 Error（带同一个 request_id），原因放 message，客户端原样显示。

// 把别人移到另一个频道。需要 PERM_MOVE_ANYONE。
message MoveUser {
  uint32 user_id    = 1;
  uint32 channel_id = 2;
}

// 改别人的服务器侧状态（被管理员静音 / 闭麦）。需要 PERM_MUTE_OTHERS。
message SetUserState {
  uint32 user_id     = 1;
  optional bool server_mute = 2;   // 不填 = 不改
  optional bool server_deaf = 3;
}

// 踢出服务器（断开会话）。需要 PERM_KICK。
message KickUser {
  uint32 user_id = 1;
  string reason  = 2;   // 会显示给被踢的人
}

// 账号列表（含离线的）。需要 PERM_ADMIN。
message ListUsers {}

message UserEntry {
  uint32 user_id   = 1;
  string username  = 2;
  uint64 perms     = 3;
  bool   anonymous = 4;
  bool   online    = 5;   // 现在有会话在线
}

message UserList {
  repeated UserEntry users = 1;
}

// 改某个账号的权限位。需要 PERM_ADMIN，且授予的位必须是自己的子集（防提权）。
// 带 PERM_OWNER 时做**原子转移**：清掉旧服主、设上新服主。
message SetUserPerms {
  uint32 user_id = 1;
  uint64 perms   = 2;
}

// 权限变了。只发给**本人**和所有带 PERM_ADMIN 的会话（v1 不广播别人的权限）。
message PermsChanged {
  uint32 user_id = 1;
  uint64 perms   = 2;
}

// ---------------------------- 密钥与运维 ----------------------------

message RekeyRequest  { uint32 key_epoch = 1; }
message RekeyResponse { uint32 key_epoch = 1; }

message Ping { uint64 ts_us = 1; }
message Pong { uint64 ts_us = 1; }

message Stats {
  uint32 rtt_ms = 1;
  uint32 loss_permille = 2;
  uint32 jitter_ms = 3;
  uint32 voice_pps = 4;
  uint32 server_voice_out_pps = 5;
  uint32 members_in_channel = 6;
}

message Error {
  uint32 code = 1;    // 见 ErrorCode
  string message = 2;
  bool fatal = 3;     // true 表示服务器随后关闭连接
}

enum ErrorCode {
  ERROR_UNSPECIFIED        = 0;
  UNSUPPORTED_VERSION      = 1;
  AUTH_FAILED              = 2;
  PERMISSION_DENIED        = 3;
  CHANNEL_NOT_FOUND        = 4;
  CHANNEL_FULL             = 5;
  RATE_LIMITED             = 6;
  SERVER_FULL              = 7;
  VOICE_BIND_TIMEOUT       = 8;
  INTERNAL                 = 9;
  INVALID_ARGUMENT         = 10;  // 名字非法、层级超限、参数越界
  CONFLICT                 = 11;  // 同级重名、频道非空、最后一个管理员
  KICKED                   = 12;  // 被管理员踢出（fatal=true）
}
