[package]
name = "hushsquad-server"
description = "HushSquad 服务器：TLS 控制面 + UDP 语音面（SFU）。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "hushsquad_server"
path = "src/lib.rs"

[[bin]]
name = "hushsquad-server"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
protocol = { path = "../../crates/protocol", version = "0.0.0" }
transport = { path = "../../crates/transport", version = "0.0.0" }
server-core = { path = "../../crates/server-core", version = "0.0.0" }
store = { path = "../../crates/store", version = "0.0.0" }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
getrandom = { workspace = true }
sha2 = { workspace = true }
argon2 = { workspace = true }
rpassword = { workspace = true }
# 证书：第一次启动时自己生成，用户不必再找 openssl。
rcgen = "0.14"

[dev-dependencies]
audio-core = { path = "../../crates/audio-core", version = "0.0.0" }
