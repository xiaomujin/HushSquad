[package]
name = "loopback"
description = "桌面环回工具（P2-2）：采集→rtrb→播放，含 --impulse 物理环回延迟测量。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
audio-core = { path = "../../crates/audio-core", version = "0.0.0" }
audio-io = { path = "../../crates/audio-io", version = "0.0.0" }
rtrb.workspace = true
hound.workspace = true
serde.workspace = true
serde_json.workspace = true

# 独占模式（--exclusive）要直接开 WASAPI 流：cpal 的公开 API 只有共享模式。
# 版本与 feature 集对齐 cpal 已经拉进来的那一份，避免多编译一遍 windows。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Devices_Properties",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }
