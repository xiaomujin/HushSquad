[package]
name = "hushsquad-client"
description = "HushSquad 客户端：TLS 控制面 + UDP 语音面 + 麦克风/扬声器。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "hushsquad_client"
path = "src/lib.rs"

[[bin]]
name = "hushsquad-client"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
protocol = { path = "../../crates/protocol", version = "0.0.0" }
transport = { path = "../../crates/transport", version = "0.0.0" }
client-core = { path = "../../crates/client-core", version = "0.0.0" }
audio-core = { path = "../../crates/audio-core", version = "0.0.0" }
audio-io = { path = "../../crates/audio-io", version = "0.0.0" }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
store = { path = "../../crates/store", version = "0.0.0" }
rtrb = { workspace = true }
rpassword = { workspace = true }

# 定时器精度（timeBeginPeriod）。版本与 feature 集对齐 audio-io 已经拉进来的那一份，
# 避免多编译一遍 windows。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Media"] }

[dev-dependencies]
# 集成测试要在同进程里起一台真服务器：只为了证明这个二进制自己的代码路径通了。
hushsquad-server = { path = "../server", version = "0.0.0" }
server-core = { path = "../../crates/server-core", version = "0.0.0" }
rcgen = "0.14"
