[package]
name = "audio-core"
description = "音频处理链路：降噪/AGC/Opus/抖动缓冲/混音。纯 DSP，无 I/O、无网络。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Opus 编码/解码。绑定 opusic-sys，构建期需要 cmake + C 工具链
# （Windows 上经 scripts/with-msvc.bat，它会补 MSVC 与本机 cmake）。
# 选型依据：docs/crates-选型验证报告-v0.1.md §2.5；备选 opus-pure（纯 Rust）留作对照实验。
opus.workspace = true
# AGC2：WebRTC 的 AGC2 纯 Rust 移植，自带 RNN VAD。选型见 crates-选型验证报告 §2.4。
# sonora-simd 必须显式依赖：构造 VAD 要指名 SIMD 后端（sonora_agc2 不重导出）。
sonora-agc2.workspace = true
sonora-simd.workspace = true
# RNNoise 降噪（低延迟档）。**必须关默认 feature**：默认会拉进 CLI 那套（clap/anyhow/dasp/hound），
# 实时 crate 不能背这些。关掉后只剩 easyfft + once_cell。
nnnoiseless = { workspace = true, default-features = false }
# 抖动缓冲（NetEQ 移植）。**必须关默认 feature**：默认的 `native` 会拉进 cpal/clap/axum/tokio/
# tower/env_logger/rand/ropus。关掉后只剩缓冲与时间伸缩，见 crates-选型验证报告 §2.6。
# 无锁 SPSC 环：抖动缓冲与音频线程之间的交接。构造期分配，热路径零分配。
rtrb.workspace = true
neteq = { workspace = true, default-features = false }
# DFN3 质量档：模型（8.4 MB ONNX）与 tract 推理都随包进来，所以**非默认 feature**。
# 选型见 crates-选型验证报告 §2.3；ARM 推理性能是未验证项（D5）。
deep-filter-rt = { workspace = true, optional = true }
# DFN3 的输入输出是 `ndarray::Array2`，必须直接依赖才能构造。
ndarray = { workspace = true, optional = true }

[features]
# 只在桌面与高端 Android 打开；关掉时 `stages::build(Dfn3)` 返回 None（链路里会明确报未实现）。
denoise-dfn3 = ["dep:deep-filter-rt", "dep:ndarray"]
