[package]
name = "testkit"
description = "离线回放、网络模拟、延迟测量与报告（CLI 工具）。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# 透传 audio-core 的 DFN3 开关：默认不编译（tract 全家 + 8.4 MB 模型，编译与产物体积都贵）。
# 用法：cargo run -p testkit --release --features denoise-dfn3 -- run --chain highpass,dfn3,agc2 ...
denoise-dfn3 = ["audio-core/denoise-dfn3"]

[dependencies]
audio-core = { path = "../audio-core", version = "0.0.0" }
protocol = { path = "../protocol", version = "0.0.0" }
transport = { path = "../transport", version = "0.0.0" }
server-core = { path = "../server-core", version = "0.0.0" }
hound.workspace = true
serde.workspace = true
serde_json.workspace = true
