# 单节点部署。多节点**不做**（v1 的 fan-out 在单进程内完成，跨节点要先解决频道归属）。
#
#   docker compose -f deploy/docker-compose.yml up -d
#
# 证书与用户表放在 ./deploy/data 下（不进版本库）：
#   openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes \
#     -keyout deploy/data/key.pem -out deploy/data/cert.pem -days 365 -subj /CN=voice.example.com
#   ./target/release/hushsquad-server --hash-password '你的密码'   # 填进 users.txt

services:
  hushsquad:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: hushsquad-server:dev
    restart: unless-stopped
    ports:
      - "64738:64738/tcp"   # 控制面（TLS 1.3）
      - "64739:64739/udp"   # 语音面（UDP，SFU）
    volumes:
      - ./data:/etc/hushsquad:ro
    command:
      - --users
      - /etc/hushsquad/users.txt
      - --cert
      - /etc/hushsquad/cert.pem
      - --key
      - /etc/hushsquad/key.pem
      - --control-bind
      - 0.0.0.0:64738
      - --voice-bind
      - 0.0.0.0:64739
      - --voice-host
      - voice.example.com
      - --voice-port
      - "64739"
      - --channel
      - 大厅
      - --metrics-interval
      - "60"
    # 日志是纯文本行，交给 docker 的 json-file 驱动即可。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
