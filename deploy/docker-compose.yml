# 单节点部署。多节点**不做**（v1 的 fan-out 在单进程内完成，跨节点要先解决频道归属）。
#
#   docker compose -f deploy/docker-compose.yml up -d
#
# 账号库与证书都放在 ./deploy/data 下（不进版本库）。第一次启动会自动创建：
#   docker compose -f deploy/docker-compose.yml run --rm hushsquad \
#     --db /data/hushsquad.db adduser 你的名字

services:
  hushsquad:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: hushsquad-server:dev
    restart: unless-stopped
    ports:
      - "64738:64738/tcp"   # 控制面（TLS 1.3）
      - "64739:64739/udp"   # 语音面（UDP，SFU）
    volumes:
      # 可写：账号库与（自动生成的）证书都在这里。
      - ./data:/data
    command:
      - --db
      - /data/hushsquad.db
      - --cert
      - /data/cert.pem
      - --key
      - /data/key.pem
      - --bind
      - 0.0.0.0:64738
      - --voice-bind
      - 0.0.0.0:64739
      # 语音面地址默认**不宣告**：客户端沿用自己连控制面用的那个地址，
      # 云主机（网卡是内网 IP、公网靠 NAT）与局域网都自动正确。
      # 语音面在另一台机器 / 另一个对外 IP 时才打开这两行：
      # - --voice-host
      # - voice.example.com
      - --voice-port
      - "64739"
      - --channel
      - 大厅
      - --metrics-interval
      - "60"
    # 日志是纯文本行，交给 docker 的 json-file 驱动即可。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
